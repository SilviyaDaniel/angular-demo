<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<div class="page">

  <!-- Header bar -->
  <div class="top-bar">
    <span class="material-icons" style="color: white; margin-left: 10px;">home</span>
    <span class="material-icons" style="color: white; margin-right: 10px;">shopping_cart</span>
  </div>

  <h1 class="title">Infinite summer ice cream store</h1>
  <p class="subtitle">Which one do you want?</p>

  <div class="container">
    <div class="card" (click)="openProduct('ice-cream')">


    <!-- Ice Cream Card -->
      <h3>Ice Cream</h3>
      <div class="ice-cream">
        <div class="scoop left"></div>
        <div class="scoop middle"></div>
        <div class="scoop right"></div>

        <div class="bowl">
          <div class="face">
            <span class="eye"></span>
            <span class="eye"></span>
            <div class="mouth"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Popsicle Card -->
     <div class="card" (click)="openProduct('popsicle')">
      <h3>Popsicle</h3>
      <div class="popsicle_wrapper">
      <div class="stick"></div>
      <div class="popsicle">
        <div class="face">
          <span class="eye"></span>
          <span class="eye"></span>
          <div class="mouth"></div>
        </div>
      </div>
    </div>
    </div>
    </div>
    </div>
